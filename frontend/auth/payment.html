<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Question Papers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .payment-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .plan-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .payment-method {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-method:hover {
            border-color: #007bff;
            background: #f8f9fa;
        }

        .payment-method.selected {
            border-color: #007bff;
            background: #e3f2fd;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
    </style>
</head>

<body style="background-color: #f0f2f5;">
    <div class="payment-container">
        <div class="text-center mb-4">
            <h2>💳 Complete Your Payment</h2>
            <p class="text-muted">Choose your plan and payment method</p>
        </div>

        <div class="plan-summary">
            <h5>📋 Plan Summary</h5>
            <div class="row">
                <div class="col-6">
                    <strong>Plan:</strong> Premium Student
                </div>
                <div class="col-6">
                    <strong>Duration:</strong> 1 Month
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-6">
                    <strong>Price:</strong> ₹299
                </div>
                <div class="col-6">
                    <strong>Total:</strong> ₹299
                </div>
            </div>
        </div>

        <form id="paymentForm">
            <div class="mb-4">
                <h5>💳 Payment Method</h5>

                <div class="payment-method" onclick="selectPayment('card')">
                    <input type="radio" name="paymentMethod" value="card" id="card" class="me-2">
                    <label for="card" class="mb-0">
                        <strong>Credit/Debit Card</strong>
                        <br>
                        <small class="text-muted">Visa, Mastercard, RuPay</small>
                    </label>
                </div>

                <div class="payment-method" onclick="selectPayment('upi')">
                    <input type="radio" name="paymentMethod" value="upi" id="upi" class="me-2">
                    <label for="upi" class="mb-0">
                        <strong>UPI</strong>
                        <br>
                        <small class="text-muted">Google Pay, PhonePe, Paytm</small>
                    </label>
                </div>

                <div class="payment-method" onclick="selectPayment('netbanking')">
                    <input type="radio" name="paymentMethod" value="netbanking" id="netbanking" class="me-2">
                    <label for="netbanking" class="mb-0">
                        <strong>Net Banking</strong>
                        <br>
                        <small class="text-muted">All major banks</small>
                    </label>
                </div>
            </div>

            <div id="cardDetails" style="display: none;">
                <h6>Card Details</h6>
                <div class="row">
                    <div class="col-12 mb-3">
                        <input type="text" class="form-control" placeholder="Card Number" maxlength="16">
                    </div>
                    <div class="col-6 mb-3">
                        <input type="text" class="form-control" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="col-6 mb-3">
                        <input type="text" class="form-control" placeholder="CVV" maxlength="3">
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Cardholder Name">
                </div>
            </div>

            <div id="upiDetails" style="display: none;">
                <h6>UPI Details</h6>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="UPI ID (e.g., name@bank)">
                </div>
            </div>

            <div id="netbankingDetails" style="display: none;">
                <h6>Bank Selection</h6>
                <div class="mb-3">
                    <select class="form-control">
                        <option>Select your bank</option>
                        <option>State Bank of India</option>
                        <option>HDFC Bank</option>
                        <option>ICICI Bank</option>
                        <option>Axis Bank</option>
                        <option>Punjab National Bank</option>
                        <option>Bank of Baroda</option>
                        <option>Canara Bank</option>
                        <option>Union Bank of India</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <h6>Billing Information</h6>
                <div class="row">
                    <div class="col-6 mb-3">
                        <input type="text" class="form-control" placeholder="First Name">
                    </div>
                    <div class="col-6 mb-3">
                        <input type="text" class="form-control" placeholder="Last Name">
                    </div>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email Address">
                </div>
                <div class="mb-3">
                    <input type="tel" class="form-control" placeholder="Phone Number">
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">
                    I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#"
                        class="text-primary">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                💳 Pay ₹299
            </button>

            <div class="text-center">
                <small class="text-muted">
                    🔒 Your payment information is secure and encrypted
                </small>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="premium" class="btn btn-outline-secondary">← Back to Plans</a>
        </div>
    </div>

    <script>
        function selectPayment(method) {
            // Hide all payment detail sections
            document.getElementById('cardDetails').style.display = 'none';
            document.getElementById('upiDetails').style.display = 'none';
            document.getElementById('netbankingDetails').style.display = 'none';

            // Remove selected class from all payment methods
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('selected');
            });

            // Show selected payment method details
            if (method === 'card') {
                document.getElementById('cardDetails').style.display = 'block';
                document.querySelector('input[value="card"]').checked = true;
                document.querySelector('input[value="card"]').closest('.payment-method').classList.add('selected');
            } else if (method === 'upi') {
                document.getElementById('upiDetails').style.display = 'block';
                document.querySelector('input[value="upi"]').checked = true;
                document.querySelector('input[value="upi"]').closest('.payment-method').classList.add('selected');
            } else if (method === 'netbanking') {
                document.getElementById('netbankingDetails').style.display = 'block';
                document.querySelector('input[value="netbanking"]').checked = true;
                document.querySelector('input[value="netbanking"]').closest('.payment-method').classList.add('selected');
            }
        }

        document.getElementById('paymentForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Payment processing... This is a demo page. In a real application, this would integrate with a payment gateway.');
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
